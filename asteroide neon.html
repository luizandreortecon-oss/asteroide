<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asteroids Neon - Mobile</title>
  <style> 
    body { margin: 0; overflow: hidden; background: #0a0a0f; touch-action: none; } 
    canvas { display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>

// ---------- CONFIGURAÇÕES ----------
const CORES = [
  [255, 0, 128], [0, 255, 255], [0, 255, 128], [255, 200, 0], [180, 0, 255]
];

let nave, asteroides = [], tiros = [], explosoes = [];
let pontuacao = 0;

// Variáveis para os botões touch
let btnEsquerda, btnDireita, btnAtirar, btnAcelerar;
let touchEsquerda = false, touchDireita = false, touchAtirar = false, touchAcelerar = false;

// ---------- FUNÇÃO DE DESENHO NEON ----------
function desenharLinhaNeon(x1, y1, x2, y2, cor) {
  let r = cor[0], g = cor[1], b = cor[2];
  stroke(r, g, b, 20); strokeWeight(10); line(x1, y1, x2, y2);
  stroke(r, g, b, 60); strokeWeight(4); line(x1, y1, x2, y2);
  stroke(r, g, b, 255); strokeWeight(1.5); line(x1, y1, x2, y2);
}

// ---------- CLASSE DA NAVE ----------
class Nave {
  constructor() {
    this.pos = createVector(width/2, height/2);
    this.vel = createVector(0, 0);
    this.ang = 0;
    this.escala = 1.2;
  }

  desenhar() {
    push();
    translate(this.pos.x, this.pos.y);
    rotate(this.ang);
    scale(this.escala);

    let linhaCentral = [ [0, 0], [30, 0] ];
    let corpo = [ 
      [30, 0], [20, -6], [0, -8], [-12, -6], [-14, 0], [-12, 6], [0, 8], [20, 6], [30, 0]
    ];
    let asaCima = [ [0, -6], [10, -14] ];
    let asaBaixo = [ [0, 6], [10, 14] ];
    let estabCima = [ [-10, -4], [-18, -8] ];
    let estabBaixo = [ [-10, 4], [-18, 8] ];
    let corNave = [255, 0, 0];

    for (let i = 0; i < corpo.length - 1; i++) {
      desenharLinhaNeon(corpo[i][0], corpo[i][1], corpo[i+1][0], corpo[i+1][1], corNave);
    }
    desenharLinhaNeon(linhaCentral[0][0], linhaCentral[0][1], linhaCentral[1][0], linhaCentral[1][1], corNave);
    desenharLinhaNeon(asaCima[0][0], asaCima[0][1], asaCima[1][0], asaCima[1][1], corNave);
    desenharLinhaNeon(asaBaixo[0][0], asaBaixo[0][1], asaBaixo[1][0], asaBaixo[1][1], corNave);
    desenharLinhaNeon(estabCima[0][0], estabCima[0][1], estabCima[1][0], estabCima[1][1], corNave);
    desenharLinhaNeon(estabBaixo[0][0], estabBaixo[0][1], estabBaixo[1][0], estabBaixo[1][1], corNave);

    pop();
  }

  atualizar() {
    this.pos.add(this.vel);
    if (this.pos.x > width) this.pos.x = 0;
    if (this.pos.x < 0) this.pos.x = width;
    if (this.pos.y > height) this.pos.y = 0;
    if (this.pos.y < 0) this.pos.y = height;
  }

  atirar() {
    let anguloTiro = this.ang;
    let dx = cos(anguloTiro) * 30;
    let dy = sin(anguloTiro) * 30;
    let posTiro = createVector(this.pos.x + dx, this.pos.y + dy);
    let t = new Tiro(posTiro.x, posTiro.y, anguloTiro);
    tiros.push(t);
  }
}

// ---------- CLASSE DO TIRO ----------
class Tiro {
  constructor(x, y, ang) {
    this.pos = createVector(x, y);
    this.vel = p5.Vector.fromAngle(ang).mult(8);
    this.cor = [255, 255, 255];
    this.vida = 60;
  }
  atualizar() {
    this.pos.add(this.vel);
    this.vida--;
    if (this.pos.x > width || this.pos.x < 0 || this.pos.y > height || this.pos.y < 0) this.vida = 0;
  }
  desenhar() {
    let final = this.pos.copy().add(this.vel.copy().mult(2));
    desenharLinhaNeon(this.pos.x, this.pos.y, final.x, final.y, this.cor);
  }
}

// ---------- CLASSE DO ASTEROIDE ----------
class Asteroide {
  constructor(x, y, tamanho = 3) {
    this.pos = x !== undefined ? createVector(x, y) : this.posicaoAleatoria();
    this.vel = p5.Vector.random2D().mult(random(1, 2.5));
    this.tamanho = tamanho;
    this.lados = floor(random(6, 10));
    this.raio = this.tamanho * 12;
    this.cor = random(CORES);
    this.desvio = createVector(0, 0);
  }
  posicaoAleatoria() {
    let p = createVector(random(width), random(height));
    while (dist(p.x, p.y, width/2, height/2) < 150) p.set(random(width), random(height));
    return p;
  }
  inteligencia() {
    let distNave = dist(this.pos.x, this.pos.y, nave.pos.x, nave.pos.y);
    if (distNave < 250) {
      let anguloNave = atan2(nave.pos.y - this.pos.y, nave.pos.x - this.pos.x);
      let meuAngulo = atan2(this.vel.y, this.vel.x);
      let diff = anguloNave - meuAngulo;
      if (diff > PI) diff -= TWO_PI;
      if (diff < -PI) diff += TWO_PI;
      if (abs(diff) < 0.8) {
        this.desvio = createVector(-this.vel.y, this.vel.x).mult(0.5);
      } else {
        this.desvio.mult(0.95);
      }
    } else {
      this.desvio.mult(0.95);
    }
  }
  atualizar() {
    this.inteligencia();
    this.pos.add(this.vel);
    this.pos.add(this.desvio);
    if (this.pos.x > width + 20) this.pos.x = -20;
    if (this.pos.x < -20) this.pos.x = width + 20;
    if (this.pos.y > height + 20) this.pos.y = -20;
    if (this.pos.y < -20) this.pos.y = height + 20;
  }
  desenhar() {
    push();
    translate(this.pos.x, this.pos.y);
    let anguloStep = TWO_PI / this.lados;
    let vertices = [];
    for (let i = 0; i < this.lados; i++) {
      let ang = i * anguloStep + random(-0.1, 0.1);
      let r = this.raio + random(-3, 3);
      vertices.push(createVector(cos(ang) * r, sin(ang) * r));
    }
    for (let i = 0; i < vertices.length; i++) {
      let v1 = vertices[i];
      let v2 = vertices[(i+1) % vertices.length];
      desenharLinhaNeon(v1.x, v1.y, v2.x, v2.y, this.cor);
    }
    pop();
  }
  explodir() {
    let numLinhas = floor(random(8, 16 + this.tamanho * 2));
    for (let i = 0; i < numLinhas; i++) {
      let ang = random(TWO_PI);
      let vel = p5.Vector.fromAngle(ang).mult(random(2, 5));
      let corExplosao = this.cor.map(c => min(c + 100, 255));
      explosoes.push({
        pos: this.pos.copy(),
        vel: vel,
        cor: corExplosao,
        vida: random(20, 40),
        tamanhoInicial: random(4, 8)
      });
    }
  }
}

// ---------- SETUP (TELA ADAPTÁVEL) ----------
function setup() {
  // Cria o canvas ocupando 100% da tela do celular
  let canvas = createCanvas(windowWidth, windowHeight);
  canvas.parent(document.body);
  
  nave = new Nave();
  for (let i = 0; i < 5; i++) asteroides.push(new Asteroide());
  
  // --- BOTÕES REPOSICIONADOS COM BASE NA TELA ---
  let tamanhoBotao = min(width, height) * 0.12; // 12% do menor lado
  let margem = 20;
  
  btnEsquerda = createButton('◀');
  btnEsquerda.position(margem, height - tamanhoBotao - margem);
  btnEsquerda.style('font-size', (tamanhoBotao * 0.5) + 'px');
  btnEsquerda.style('background', 'rgba(255,255,255,0.15)');
  btnEsquerda.style('color', 'white');
  btnEsquerda.style('border', '2px solid cyan');
  btnEsquerda.style('border-radius', '50%');
  btnEsquerda.style('width', tamanhoBotao + 'px');
  btnEsquerda.style('height', tamanhoBotao + 'px');
  btnEsquerda.touchStarted(() => touchEsquerda = true);
  btnEsquerda.touchEnded(() => touchEsquerda = false);

  btnDireita = createButton('▶');
  btnDireita.position(margem + tamanhoBotao + 10, height - tamanhoBotao - margem);
  btnDireita.style('font-size', (tamanhoBotao * 0.5) + 'px');
  btnDireita.style('background', 'rgba(255,255,255,0.15)');
  btnDireita.style('color', 'white');
  btnDireita.style('border', '2px solid cyan');
  btnDireita.style('border-radius', '50%');
  btnDireita.style('width', tamanhoBotao + 'px');
  btnDireita.style('height', tamanhoBotao + 'px');
  btnDireita.touchStarted(() => touchDireita = true);
  btnDireita.touchEnded(() => touchDireita = false);

  btnAcelerar = createButton('🚀');
  btnAcelerar.position((width - tamanhoBotao) / 2, height - tamanhoBotao - margem);
  btnAcelerar.style('font-size', (tamanhoBotao * 0.5) + 'px');
  btnAcelerar.style('background', 'rgba(255,255,255,0.15)');
  btnAcelerar.style('color', 'lime');
  btnAcelerar.style('border', '2px solid lime');
  btnAcelerar.style('border-radius', '50%');
  btnAcelerar.style('width', tamanhoBotao + 'px');
  btnAcelerar.style('height', tamanhoBotao + 'px');
  btnAcelerar.touchStarted(() => touchAcelerar = true);
  btnAcelerar.touchEnded(() => touchAcelerar = false);

  btnAtirar = createButton('🔥');
  btnAtirar.position(width - tamanhoBotao - margem, height - tamanhoBotao - margem);
  btnAtirar.style('font-size', (tamanhoBotao * 0.5) + 'px');
  btnAtirar.style('background', 'rgba(255,255,255,0.15)');
  btnAtirar.style('color', 'red');
  btnAtirar.style('border', '2px solid red');
  btnAtirar.style('border-radius', '50%');
  btnAtirar.style('width', tamanhoBotao + 'px');
  btnAtirar.style('height', tamanhoBotao + 'px');
  btnAtirar.touchStarted(() => touchAtirar = true);
  btnAtirar.touchEnded(() => touchAtirar = false);
}

// Se a tela girar (rotacionar o celular), ajusta o tamanho
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  // Reposiciona os botões (o código de posição já usa 'height' e 'width' dinâmicos)
  // Para simplificar, recarregue a página se rotacionar.
}

// ---------- LOOP PRINCIPAL ----------
function draw() {
  background(10, 10, 15);
  
  // Controles touch ativos
  if (touchEsquerda) nave.ang -= 0.3;
  if (touchDireita) nave.ang += 0.3;
  if (touchAcelerar) {
    let forca = p5.Vector.fromAngle(nave.ang).mult(0.2);
    nave.vel.add(forca);
  }
  if (touchAtirar) {
    nave.atirar();
    touchAtirar = false; // Atira apenas uma vez por toque
  }

  nave.atualizar();
  for (let a of asteroides) a.atualizar();
  for (let t of tiros) t.atualizar();
  
  // Colisões
  for (let i = tiros.length - 1; i >= 0; i--) {
    let t = tiros[i];
    for (let j = asteroides.length - 1; j >= 0; j--) {
      let a = asteroides[j];
      if (dist(t.pos.x, t.pos.y, a.pos.x, a.pos.y) < a.raio) {
        a.explodir();
        if (a.tamanho > 1) {
          asteroides.push(new Asteroide(a.pos.x, a.pos.y, a.tamanho - 1));
          asteroides.push(new Asteroide(a.pos.x, a.pos.y, a.tamanho - 1));
        }
        asteroides.splice(j, 1);
        tiros.splice(i, 1);
        pontuacao += 10;
        break;
      }
    }
  }
  
  for (let i = explosoes.length - 1; i >= 0; i--) {
    let e = explosoes[i];
    e.pos.add(e.vel);
    e.vel.mult(0.98);
    e.vida--;
    if (e.vida <= 0) explosoes.splice(i, 1);
  }
  
  if (asteroides.length < 3) asteroides.push(new Asteroide());

  nave.desenhar();
  for (let a of asteroides) a.desenhar();
  for (let t of tiros) t.desenhar();
  for (let e of explosoes) {
    let tam = e.tamanhoInicial * (e.vida / 40);
    let final = e.pos.copy().add(e.vel.copy().mult(tam));
    desenharLinhaNeon(e.pos.x, e.pos.y, final.x, final.y, e.cor);
  }

  fill(255, 255, 255, 150);
  noStroke();
  textSize(min(width, height) * 0.04);
  text(`Pontos: ${pontuacao}`, 20, 30);
  text(`Asteroides: ${asteroides.length}`, 20, 55);
}

// ---------- CONTROLES DE TECLADO (PC) ----------
function keyPressed() {
  if (key === 'w' || key === 'W') {
    let forca = p5.Vector.fromAngle(nave.ang).mult(0.2);
    nave.vel.add(forca);
  }
  if (key === ' ') nave.atirar();
  if (key === 'a' || key === 'A') nave.ang -= 0.3;
  if (key === 'd' || key === 'D') nave.ang += 0.3;
}

</script>
</body>
</html>
